[project]
name = "iceobs-collector"
version = "0.1.0"
description = "Read-only Iceberg lakehouse Collector: exports table Signals as Prometheus metrics"
requires-python = ">=3.11"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "prometheus-client>=0.20",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iceobs_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
